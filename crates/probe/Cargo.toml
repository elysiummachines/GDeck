[package]
name = "probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Phase 0 read only HID probe for the Corsair K95 RGB (1b1c:1b11)"

# No dependencies, on purpose. Every Win32 entry point this binary uses is
# declared by hand in src/main.rs, so the import table can be audited directly
# and contains no device write function at all.
[dependencies]

[[bin]]
name = "probe"
path = "src/main.rs"
